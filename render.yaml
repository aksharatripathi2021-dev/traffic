# ─────────────────────────────────────────────────────────
# NIRNAY – Render Blueprint Specification
# https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────

services:
  - type: web
    name: nirnay-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./nirnay.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        value: "https://golden-dolphin-a9abd9.netlify.app,http://localhost:3000,http://localhost:5173"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: PYTHON_VERSION
        value: "3.11.6"
